  --bg0:#e3eef6; --b1:#5fd0c9; --b2:#86b4ff; --b3:#ffc09b;
  --fg:#0d2433; --mute:#47606f;
  --glass:rgba(255,255,255,.50); --glass2:rgba(255,255,255,.74);
  --edge:rgba(255,255,255,.85); --edge2:rgba(255,255,255,.42); --spec:.55; --shade:rgba(24,70,100,.18);
  --accent:#0a7f8c; --on-accent:#ffffff; --warn:#d9531e; --ok:#16905a; --info:#1b62c4;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg0:#07121b; --b1:#0f7f78; --b2:#2a56b0; --b3:#9a4c33;
  --fg:#e7f2f7; --mute:#93aebd;
  --glass:rgba(32,54,70,.46); --glass2:rgba(44,70,90,.66);
  --edge:rgba(255,255,255,.30); --edge2:rgba(255,255,255,.12); --spec:.16; --shade:rgba(0,0,0,.5);
  --accent:#62dcd2; --on-accent:#04211f; --warn:#ff9a6c; --ok:#5fd69b; --info:#8ab8ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg0:#07121b; --b1:#0f7f78; --b2:#2a56b0; --b3:#9a4c33;
  --fg:#e7f2f7; --mute:#93aebd;
  --glass:rgba(32,54,70,.46); --glass2:rgba(44,70,90,.66);
  --edge:rgba(255,255,255,.30); --edge2:rgba(255,255,255,.12); --spec:.16; --shade:rgba(0,0,0,.5);
  --accent:#62dcd2; --on-accent:#04211f; --warn:#ff9a6c; --ok:#5fd69b; --info:#8ab8ff; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg0);color:var(--fg);font:16px/1.5 var(--f);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60vmax 50vmax at 12% 8%,var(--b1),transparent 62%),radial-gradient(55vmax 55vmax at 92% 22%,var(--b2),transparent 60%),radial-gradient(60vmax 50vmax at 40% 105%,var(--b3),transparent 62%);opacity:.9}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:16px;font-weight:700}
.muted{color:var(--mute)} .small{font-size:13px} .lbl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.glass{position:relative;border-radius:var(--r,28px);background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--edge2),inset 0 -14px 22px -18px var(--edge2),0 14px 36px -16px var(--shade)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--spec);
  background:linear-gradient(140deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 72%,rgba(255,255,255,.3) 100%)}
.glass>*{position:relative}

.shell{display:grid;gap:18px;max-width:1120px;margin:0 auto;padding-block:14px 118px}
main{min-width:0;display:grid;gap:18px;align-content:start}
.top{display:grid;gap:6px;padding:8px 4px 2px}
.view{display:none;gap:16px;min-width:0} .view.on{display:grid}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.card{padding:20px;display:grid;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs-in{pointer-events:auto;display:flex;gap:2px;width:100%;max-width:540px;padding:6px;--r:999px}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:999px;padding:7px 2px 6px;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer;min-height:48px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent);background:var(--glass2);box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--edge2)}
.brand{display:none}

.btn{border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:600;cursor:pointer;background:var(--glass2);box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--edge2);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px -10px var(--accent)}
.btn.warn{color:var(--warn)}
.in{width:100%;min-height:44px;border-radius:14px;border:0;background:var(--glass2);padding:8px 12px;box-shadow:inset 0 0 0 1px var(--edge2),inset 0 1px 2px var(--shade);font-size:16px}
.fld{display:grid;gap:6px;min-width:0}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));align-items:end}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.c-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.c-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.c-info{color:var(--info);background:color-mix(in srgb,var(--info) 15%,transparent)}
.c-acc{color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.item{--r:22px;overflow:hidden}
.item summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.item summary::-webkit-details-marker{display:none}
.chev{margin-left:auto;width:18px;height:18px;flex:none;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.item[open] .chev{transform:rotate(180deg)}
.chk{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid color-mix(in srgb,var(--fg) 34%,transparent);background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;color:transparent}
.chk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.it-main{min-width:0;display:grid;gap:4px}
.it-title{font-weight:600;line-height:1.3;text-wrap:balance}
.it-sub{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.it-body{padding:0 16px 16px 58px;display:grid;gap:10px;font-size:15px}
.it-body ol,.it-body ul{margin:0;padding-left:20px;display:grid;gap:6px}
.done .it-title{text-decoration:line-through;opacity:.6}
.src{font-size:12.5px;color:var(--mute)}
.group{display:flex;align-items:center;gap:10px;padding:8px 4px 0}
.group .lbl{white-space:nowrap}
.group i{height:1px;flex:1;background:var(--edge2)}
.list{display:grid;gap:10px}

.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--fg) 12%,transparent);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .3s}
.bag{display:grid;gap:2px}
.bagi{display:flex;gap:12px;align-items:center;padding:8px 0;cursor:pointer;min-height:44px;border:0;background:transparent;text-align:left;width:100%}
.bagi .chk{width:26px;height:26px}
.bagi.on span{text-decoration:line-through;opacity:.55}

.temp{font-size:clamp(52px,12vw,72px);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.adv{display:grid;gap:10px}
.advr{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--fg) 6%,transparent)}
.advr .big{grid-column:2;font-weight:700}
.pill{display:inline-block;font-weight:700;font-size:14px;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.pill.off{background:color-mix(in srgb,var(--fg) 10%,transparent);color:var(--mute)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--edge2);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.note{padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--info) 12%,transparent);font-size:14px}
.sw{display:inline-flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:6px 0;min-height:44px;font-weight:600}
.sw i{width:50px;height:30px;border-radius:99px;background:color-mix(in srgb,var(--fg) 22%,transparent);position:relative;transition:background .2s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked=true] i{background:var(--ok)} .sw[aria-checked=true] i::after{transform:translateX(20px)}

@media (min-width:860px){
  .shell{grid-template-columns:236px minmax(0,1fr);gap:24px;padding-block:24px 40px}
  .tabs{position:sticky;top:24px;align-self:start;display:block;padding:0}
  .tabs-in{flex-direction:column;max-width:none;padding:10px;gap:4px;--r:30px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;font-size:15px;min-height:46px}
  .brand{display:block;padding:10px 14px 12px;font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const DAY=864e5, pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d)?null:d};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const addMonths=(d,n)=>{const t=new Date(d.getFullYear(),d.getMonth()+n,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return new Date(t.getFullYear(),t.getMonth(),Math.min(d.getDate(),last))};
const diffDays=(a,b)=>Math.round((a-b)/DAY);
const WD=['CN','T2','T3','T4','T5','T6','T7'];
const fmt=d=>WD[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
const at=(dob,s)=>{let d=dob;if(s.y)d=addMonths(d,s.y*12);if(s.m)d=addMonths(d,s.m);if(s.d)d=addDays(d,s.d);return d};
function ageText(dob,now){const d=diffDays(now,dob);if(d<0)return null;if(d<14)return d+' ngày tuổi';if(d<84)return Math.floor(d/7)+' tuần tuổi';
  let m=(now.getFullYear()-dob.getFullYear())*12+now.getMonth()-dob.getMonth();if(now.getDate()<dob.getDate())m--;
  if(m<24)return m+' tháng tuổi';const y=Math.floor(m/12),r=m%12;return y+' tuổi'+(r?' '+r+' tháng':'')}
function ageLabel(s){if(s.y&&!s.m&&!s.d)return s.y+' tuổi';if(s.m){return s.m+' tháng'+(s.d?' + '+Math.round(s.d/7)+' tuần':'')}
  if(s.d===0)return 'Sơ sinh';return Math.round(s.d/7)+' tuần'}

function buildEvents(dob,st,dv,now){const ev=[],done=st.done||{};
  buildPaper(dob,st).forEach(p=>{if(done['p-'+p.id])return;
    const d=p.dl||p.date;if(d<now)return;
    ev.push({uid:'p-'+p.id,date:d,title:(p.dl?'Hạn: ':'Giấy tờ: ')+p.title,desc:p.short,alarms:p.dl?['-P6DT15H','-PT15H','PT8H']:['-PT15H','PT8H']})});
  buildVax(dob,dv).forEach(v=>{if(done['v-'+v.id]||v.date<now)return;
    ev.push({uid:'v-'+v.id,date:v.date,title:(v.b?'Mũi nhắc lại: ':'Tiêm: ')+v.n,desc:(v.note||'')+' Mang theo sổ tiêm chủng và thẻ BHYT. Xác nhận lịch với trạm y tế hoặc cơ sở tiêm.',alarms:['-P6DT15H','-PT15H','PT8H']})});
  return ev}
function buildICS(events,now){const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const dt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const u=new Date(now),stamp=u.getUTCFullYear()+pad(u.getUTCMonth()+1)+pad(u.getUTCDate())+'T'+pad(u.getUTCHours())+pad(u.getUTCMinutes())+pad(u.getUTCSeconds())+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gia Dinh Dua Hau//VI','CALSCALE:GREGORIAN','X-WR-CALNAME:Lịch của bé'];
  events.forEach(e=>{L.push('BEGIN:VEVENT','UID:'+e.uid+'-'+dt(e.date)+'@duahau','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+dt(e.date),'DTEND;VALUE=DATE:'+dt(addDays(e.date,1)),'SUMMARY:'+esc(e.title),'DESCRIPTION:'+esc(e.desc||''));
    (e.alarms||[]).forEach(a=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc(e.title),'TRIGGER:'+a,'END:VALARM'));L.push('END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n')}

function wmo(c){if(c==null)return '';if(c===0)return 'Trời quang';if(c<=2)return 'Ít mây';if(c===3)return 'Nhiều mây';if(c===45||c===48)return 'Sương mù';
  if(c>=51&&c<=57)return 'Mưa phùn';if(c>=61&&c<=67)return 'Mưa';if(c>=80&&c<=82)return 'Mưa rào';if(c>=95)return 'Dông';return 'Nhiều mây'}
function advise(w,ageDays){const T=isFinite(w.feels)?w.feels:w.t,rh=w.rh,young=ageDays==null||ageDays<90,flags=[];let wear,layers,ac,fan;
  const rain=(w.code>=51&&w.code<=67)||(w.code>=80&&w.code<=82)||w.code>=95;
  if(T>=33){layers='1 lớp';wear='1 lớp cotton mỏng thoáng. Không quấn ủ, không đội mũ trong nhà. Ra ngoài thêm mũ vành rộng và tránh 10 giờ đến 16 giờ.';
    ac={on:1,set:'27°C',text:'Bật điều hòa 27°C, gió nhẹ hướng lên trần, không thổi thẳng vào bé. Chênh lệch trong và ngoài nhà không quá khoảng 8°C.'};
    fan={text:'Không dùng quạt sưởi. Quạt thường đặt xa ít nhất 2 m, quay vào tường hoặc trần, tốc độ thấp.'}}
  else if(T>=29){layers='1 lớp';wear='1 lớp cotton thoáng. Ra ngoài thêm khăn mỏng và mũ vành.';
    ac={on:1,set:'27°C',text:'Bật điều hòa 27°C nếu phòng trên 28°C, gió nhẹ. Nếu phòng thoáng thì mở cửa và dùng quạt xoay.'};
    fan={text:'Không dùng quạt sưởi. Quạt thường đặt xa, không thổi thẳng vào bé.'}}
  else if(T>=25){layers='1 đến 2 lớp';wear='Bodysuit cotton, thêm áo mỏng nếu bé dưới 1 tháng hoặc có gió. Tất mỏng khi ngủ.';
    ac={on:0,text:'Không cần điều hòa. Mở cửa cho thoáng. Phòng kín trên 28°C thì bật 27°C.'};fan={text:'Không cần quạt sưởi. Quạt thường chỉ bật nhẹ khi phòng bí.'}}
  else if(T>=21){layers='2 lớp';wear='Bodysuit và áo dài tay, tất. Mang thêm áo khoác mỏng khi ra ngoài.';
    ac={on:0,text:'Không cần điều hòa. Đóng bớt cửa để tránh gió lùa, giữ phòng 24 đến 27°C.'};fan={text:'Không cần quạt sưởi và quạt thường.'}}
  else if(T>=17){layers='3 lớp';wear='Bodysuit, áo nỉ hoặc len mỏng, áo khoác. Tất, mũ, bao tay khi ra ngoài.';
    ac={on:2,set:'25°C',text:'Phòng dưới 24°C thì sưởi hoặc điều hòa chế độ Heat 25°C. Từ 24°C trở lên thì không cần.'};
    fan={text:'Quạt sưởi: bật mức thấp 15 đến 30 phút trước giờ ngủ, đặt cách bé ít nhất 1,5 đến 2 m, không hướng thẳng vào bé, tắt khi phòng đạt 25°C. Có nhiệt kế đặt ngang nôi.'}}
  else if(T>=13){layers='3 lớp, thêm túi ngủ';wear='Bodysuit, áo nỉ, áo khoác, mũ, tất, bao tay. Ngủ trong túi ngủ thay cho chăn dày.';
    ac={on:2,set:'25°C',text:'Sưởi ấm phòng giữ 25 đến 26°C. Điều hòa chế độ Heat 25°C nếu dùng điều hòa hai chiều.'};
    fan={text:'Quạt sưởi mức thấp, đặt cách bé 2 m, không hướng thẳng vào bé, không để chạy khi không có người trông. Đặt chậu nước hoặc máy tạo ẩm để giữ ẩm 50 đến 60%. Mở cửa nhỏ thông gió 10 phút mỗi vài giờ.'}}
  else{layers='3 đến 4 lớp mỏng, túi ngủ';wear='Nhiều lớp mỏng chồng nhau, mũ, tất, bao tay, túi ngủ. Hạn chế ra ngoài và chỉ đi khi cần.';
    ac={on:2,set:'25°C',text:'Sưởi giữ 25 đến 26°C cả ngày và đêm. Không dùng lò than hay bếp than trong phòng bé.'};
    fan={text:'Quạt sưởi mức thấp đặt cách bé ít nhất 2 m, không hướng thẳng vào bé. Giữ ẩm 50 đến 60% và thông gió nhẹ để tránh khô mũi họng.'}}
  if(rh>=85){flags.push('Trời nồm, độ ẩm '+Math.round(rh)+'%: bật điều hòa chế độ Dry (hút ẩm) 26 đến 27°C, hong đồ của bé bằng máy sấy hoặc phòng khô, thay ngay đồ bị ẩm.');if(ac.on===0)ac={on:3,set:'26°C',text:'Nên bật chế độ Dry (hút ẩm) 26°C để phòng khô, dù nhiệt độ không cao.'}}
  if(rh<=40&&T<21)flags.push('Trời hanh khô: giữ ẩm phòng 50 đến 60%, bôi kem dưỡng ẩm cho da bé sau tắm.');
  if(rain)flags.push('Có mưa: hạn chế đưa bé ra ngoài, nếu đi thì che kín nôi hoặc địu bằng áo mưa.');
  if(isFinite(w.tmin)&&isFinite(w.tmax)){if(w.tmax-w.tmin>=8)flags.push('Hôm nay chênh lệch nhiệt lớn ('+Math.round(w.tmin)+' đến '+Math.round(w.tmax)+'°C): mặc nhiều lớp mỏng để thêm bớt dễ dàng.')}
  if(young)flags.push('Bé nhỏ khó tự điều nhiệt: sờ gáy và ngực bé. Ấm và khô là vừa, đổ mồ hôi là thừa lớp, tay chân hơi mát là bình thường.');
  if(T<17)flags.push('Khi ngủ không đắp chăn hay chèn gối quanh bé, nôi bé để trống.');
  return {wear,layers,ac,fan,flags,T}}
</script>

const BAG=[['Giấy tờ và tiền',['CCCD hoặc VNeID của mẹ và bố','Thẻ BHYT của mẹ','Sổ khám thai, kết quả siêu âm và xét nghiệm','Giấy hẹn hoặc giấy giới thiệu của bệnh viện (nếu có)','Tiền mặt và thẻ ngân hàng','Giấy đăng ký kết hôn (nếu có)']],
 ['Cho mẹ',['2 đến 3 bộ đồ rộng, mở khuy trước để cho bú','2 đến 3 áo ngực cho bú','Quần lót dùng một lần hoặc quần lót lưới','Băng vệ sinh sau sinh hoặc tã quần người lớn','Miếng lót thấm sữa','Dép chống trượt','Đồ vệ sinh cá nhân, khăn mặt, khăn tắm','Sạc điện thoại và sạc dự phòng','Bình nước, ống hút, đồ ăn nhẹ','Gối cho bú (nếu cần)']],
 ['Cho bé',['4 đến 5 bộ bodysuit hoặc áo liền quần sơ sinh (size NB)','Mũ, tất, bao tay, bao chân','2 đến 3 khăn xô và 1 khăn tắm','Khăn quấn mỏng và túi ngủ','Tã size NB (1 bịch)','Khăn ướt không mùi, bông gòn, nước muối sinh lý 0,9%','Kem chống hăm','Bộ đồ xuất viện cho bé theo thời tiết','Nhiệt kế điện tử','Bình sữa và sữa công thức dự phòng, nếu gia đình dự định dùng','Ghế ngồi ô tô (nếu đi ô tô)']],
 ['Cho bố và người nhà',['Sạc dự phòng, tai nghe','Áo ấm và đồ thay cho 1 đến 2 ngày','Chăn mỏng, gối nhỏ','Đồ ăn và nước uống','Số điện thoại bác sĩ, người thân, tài xế','Túi đựng đồ bẩn']]];
const GUIDES=[
 {id:'g-o',t:'Vỗ ợ hơi sau bú',s:'3 tư thế, 5 đến 10 phút',steps:['Sau mỗi cữ bú (hoặc giữa cữ nếu bé bú nhanh), giữ bé thẳng người.','Chọn một tư thế: vắt vai (đầu bé tựa vai bố mẹ), ngồi trên đùi (một tay đỡ ngực và cằm, người bé hơi nghiêng về trước), hoặc nằm sấp trên đùi với đầu cao hơn ngực.','Khum bàn tay, vỗ nhẹ hoặc xoa lên lưng từ giữa lên vai, khoảng 5 đến 10 phút.','Chưa ợ thì đổi tư thế thử thêm 1 đến 2 phút. Bé vẫn không ợ thì đặt bé nằm nghiêng, đầu cao nhẹ, và theo dõi.','Giữ bé thẳng người 15 đến 20 phút sau bú, tránh đặt nằm ngay.'],warn:'Đi khám nếu bé nôn vọt, nôn có màu xanh, vàng hoặc có máu, bỏ bú, ngủ li bì hoặc sốt.'},
 {id:'g-m',t:'Hút mũi',s:'Nước muối trước, hút nhẹ sau',steps:['Rửa tay, chuẩn bị nước muối sinh lý 0,9% và dụng cụ hút mũi đã vệ sinh.','Đặt bé nằm ngửa, đầu cao nhẹ hoặc nằm nghiêng. Nhỏ 1 đến 2 giọt nước muối mỗi bên mũi, chờ 30 đến 60 giây cho dịch mềm ra.','Hút từng bên: bịt bên còn lại nhẹ nhàng, đặt đầu dụng cụ ở cửa mũi, không đưa sâu, hút nhẹ.','Làm trước giờ bú hoặc giờ ngủ. Chỉ hút khi bé nghẹt mũi rõ, khoảng 2 đến 3 lần mỗi ngày là đủ, hút nhiều làm niêm mạc sưng thêm.','Rửa dụng cụ bằng nước ấm xà phòng sau mỗi lần dùng, phơi khô.'],warn:'Đi khám nếu bé khò khè, thở nhanh, rút lõm ngực, bỏ bú, hoặc sốt từ 38°C khi dưới 3 tháng tuổi.'},
 {id:'g-t',t:'Thay tã',s:'Lau từ trước ra sau',steps:['Chuẩn bị tã sạch, khăn ướt hoặc bông và nước ấm, kem chống hăm. Một tay luôn giữ bé.','Đặt bé nằm ngửa trên mặt phẳng, mở tã bẩn, dùng phần sạch của tã lau sơ.','Nâng hai chân bé, lau từ trước ra sau (bé gái bắt buộc), lau kỹ các nếp gấp, để khô.','Thoa mỏng kem chống hăm nếu da đỏ. Trượt tã sạch xuống dưới mông, kéo mặt trước lên, dán khít vừa chừa được hai ngón tay.','Khi còn cuống rốn, gập mép tã xuống dưới cuống rốn. Gói tã bẩn lại, bỏ rác, rửa tay.'],warn:'Thay tã mỗi 2 đến 3 giờ hoặc ngay khi bẩn. Từ ngày thứ 5, bé thường có 6 đến 8 tã ướt mỗi ngày. Báo bác sĩ nếu phân có máu, phân trắng hoặc đen kéo dài, hoặc rất ít nước tiểu.'},
 {id:'g-p',t:'Pha sữa công thức',s:'Nước trước, bột sau',steps:['Rửa tay, rửa bình, núm vú, nắp bằng nước ấm xà phòng rồi tiệt trùng. Lau sạch mặt bàn pha sữa.','Đọc bảng pha trên hộp sữa và pha đúng tỷ lệ: không pha đặc hơn hay loãng hơn.','Bé dưới 3 tháng hoặc sinh non: đun sôi nước rồi để nguội còn khoảng 70°C (khoảng 30 phút sau sôi), đổ nước vào bình trước.','Cho bột vào bằng thìa kèm hộp, gạt ngang, lắc hoặc xoay nhẹ cho tan.','Làm nguội bình dưới vòi nước lạnh. Nhỏ vài giọt lên cổ tay trong: ấm vừa, không nóng.','Cho bé bú ngay. Sữa thừa sau khi bé bú xong thì bỏ, không dùng lại cho cữ sau.'],warn:'Kiểm tra hạn dùng của hộp sữa và thời gian dùng sau khi mở nắp theo hướng dẫn của nhà sản xuất.'},
 {id:'g-mp',t:'Máy pha sữa tự động',s:'Dùng và vệ sinh',steps:['Đặt máy trên mặt phẳng, khô, gần ổ điện. Rửa và làm khô các bộ phận tiếp xúc với sữa trước lần đầu dùng.','Đổ nước đã đun sôi để nguội hoặc nước tinh khiết vào bình theo vạch. Không dùng nước đang nóng nếu hướng dẫn của máy không cho phép.','Cho bột sữa vào ngăn chứa, đậy kín nắp. Bột sữa vón cục hoặc ẩm thì bỏ.','Chọn lượng sữa và nhiệt độ theo tuổi bé và hướng dẫn của hãng, bấm pha. Thử nhiệt độ lên cổ tay trước khi cho bé bú.','Cuối ngày đổ nước thừa, tháo rửa ngăn bột và đường dẫn, để khô. Tẩy cặn định kỳ theo sách hướng dẫn của hãng.'],warn:'Mỗi hãng có thang nhiệt độ và cách vệ sinh khác nhau. Làm theo sách hướng dẫn đi kèm máy.'},
 {id:'g-ts',t:'Máy tiệt trùng bình sữa',s:'Hơi nước, sấy khô',steps:['Rửa bình, núm vú, nắp bằng nước ấm xà phòng và xả sạch trước khi tiệt trùng.','Xếp đồ úp miệng xuống hoặc đặt đúng giá theo hướng dẫn của hãng, núm vú không chồng lên nhau.','Đổ nước (thường là nước lọc hoặc nước tinh khiết) vào đáy máy đến vạch quy định, đậy nắp.','Chọn chương trình tiệt trùng kèm sấy khô nếu máy có, bấm bắt đầu và chờ máy báo xong.','Để nguyên nắp đóng đến khi dùng. Nhiều máy giữ được tình trạng sạch khoảng 24 giờ nếu không mở nắp, xem sách hướng dẫn của máy.','Tẩy cặn máy định kỳ bằng chất tẩy cặn hoặc axit citric theo hướng dẫn của hãng.'],warn:'Chỉ cho vào máy đồ chịu nhiệt (kiểm tra ký hiệu trên bình, núm vú, dụng cụ hút sữa).'},
 {id:'g-n',t:'Điều hòa, quạt, sưởi theo mùa ở miền Bắc',s:'Phòng bé 24 đến 27°C, ẩm 50 đến 60%',steps:['Nhiệt độ phòng bé nên giữ trong khoảng 24 đến 27°C, độ ẩm 50 đến 60%. Đặt nhiệt kế ngang tầm nôi để theo dõi.','Điều hòa không thổi thẳng vào bé. Hướng gió lên trần, quạt gió nhẹ, chênh lệch trong và ngoài nhà không quá khoảng 8°C.','Quạt thường đặt xa ít nhất 2 m, quay vào tường hoặc trần.','Quạt sưởi đặt cách bé ít nhất 1,5 đến 2 m, không hướng thẳng vào bé, có nhiệt kế để tắt khi phòng đủ ấm, không bật khi không có người trông. Không dùng lò than hoặc bếp than trong phòng kín.'],table:1,warn:'Quan sát bé là cách chính xác nhất: gáy và ngực ấm khô là vừa. Ra mồ hôi là thừa lớp, người mát lạnh và môi tím là thiếu ấm, cần xử lý và báo bác sĩ.'}

async function fetchWx(lat,lon,label){wxStatus='loading';renderWx();
  try{const c=new AbortController(),to=setTimeout(()=>c.abort(),9000);
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1',{signal:c.signal});
    clearTimeout(to);if(!r.ok)throw 0;const j=await r.json(),cu=j.current,dl=j.daily;
    S.wx={t:cu.temperature_2m,feels:cu.apparent_temperature,rh:cu.relative_humidity_2m,code:cu.weather_code,wind:cu.wind_speed_10m,tmax:dl.temperature_2m_max[0],tmin:dl.temperature_2m_min[0],at:Date.now(),label:label};
    S.useMan=false;save();wxStatus='ok'}catch(e){wxStatus='fail'}renderWx()}

  BAG.map((g,gi)=>'<div><div class="lbl" style="margin:8px 0 2px">'+g[0]+'</div><div class="bag">'+g[1].map((t,i)=>{const id=gi+':'+i,on=!!S.bag[id];return '<button class="bagi'+(on?' on':'')+'" data-act="bag" data-id="'+id+'"><span class="chk" aria-hidden="true" style="'+(on?'background:var(--ok);border-color:var(--ok);color:#fff':'')+'">'+CHECK+'</span><span>'+t+'</span></button>'}).join('')+'</div></div>').join('')+'</section>';
  h+='<div class="group"><span class="lbl">Hướng dẫn chăm bé</span><i></i></div><div class="list">'+GUIDES.map(g=>'<details class="item glass" data-id="'+g.id+'"'+(openSet.has(g.id)?' open':'')+'><summary><div class="it-main"><div class="it-title">'+g.t+'</div><div class="it-sub">'+g.s+'</div></div>'+CHEV+'</summary><div class="it-body" style="padding-left:16px"><ol>'+g.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'+
   (g.table?'<div class="tw"><table><thead><tr><th>Mùa</th><th>Thời tiết</th><th>Gợi ý</th></tr></thead><tbody>'+SEASON.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')+'</tbody></table></div>':'')+
   '<div class="note">'+g.warn+'</div></div></details>').join('')+'</div>';
  $('#v-cam-nang').innerHTML=h}

function renderBaby(){const d=parse(S.dob),future=d&&d>today();
  $('#v-be').innerHTML='<section class="glass card"><h2>Thông tin của bé</h2><div class="form"><label class="fld"><span class="lbl">Tên hoặc biệt danh</span><input class="in" id="nameIn" value="'+esc(S.name)+'" maxlength="40"></label>'+
  '<label class="fld"><span class="lbl">Ngày sinh</span><input class="in" type="date" id="dobIn" value="'+esc(S.dob)+'" max="'+ymd(today())+'"></label>'+
  '<label class="fld"><span class="lbl">Ngày dự sinh</span><input class="in" type="date" id="eddIn" value="'+esc(S.edd)+'"></label>'+
  '<label class="fld"><span class="lbl">Ngày đã khai sinh (nếu có)</span><input class="in" type="date" id="regIn" value="'+esc(S.reg)+'"></label></div>'+
  (future?'<div class="note">Ngày sinh chưa tới. Nếu bé chưa chào đời, hãy dùng ô ngày dự sinh.</div>':'')+
  '<p class="src">Dữ liệu chỉ lưu trên thiết bị này.</p></section>'+
  '<section class="glass card"><h2>Nhắc hẹn trên Lịch iPhone</h2>'+(ART?'<p class="muted">Bản xem nhanh này không xuất được tệp lịch. Dùng bản tệp .html của app để thêm tất cả mốc vào Lịch, kèm báo thức 7 ngày, 1 ngày trước và buổi sáng ngày hẹn.</p>':
   '<p class="muted">Xuất mọi mốc giấy tờ và tiêm chủng chưa xong thành tệp .ics. Mở tệp bằng Safari để thêm vào Lịch, mỗi mốc có báo thức trước 7 ngày (với hạn và mũi tiêm), 1 ngày và sáng ngày hẹn.</p><button class="btn pri" data-act="ics"'+(curDob()?'':' disabled')+'>Thêm tất cả vào Lịch</button>'+(curDob()?'':'<p class="src">Nhập ngày sinh để xuất lịch.</p>'))+'</section>'+
  '<section class="glass card"><h3>Xóa dữ liệu</h3>'+(confirmReset?'<p>Xóa toàn bộ dữ liệu trên thiết bị này?</p><div class="chips"><button class="btn warn" data-act="resetok">Xóa hết</button><button class="btn" data-act="resetno">Giữ lại</button></div>':'<button class="btn warn" data-act="reset">Xóa dữ liệu của bé</button>')+'</section>'}

function render(){renderTop();renderHome();renderPaper();renderVax();renderGuide();renderBaby()}
function go(v){if(!['home','giay-to','tiem-chung','cam-nang','be'].includes(v))v='home';
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.v===v)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
  if(location.hash!=='#'+v){try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}}window.scrollTo(0,0)}
function dlICS(){const d=curDob();if(!d)return;const now=new Date(),txt=buildICS(buildEvents(d,S,S.dv,today()),now);
  const u=URL.createObjectURL(new Blob([txt],{type:'text/calendar;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='gia-dinh-dua-hau-lich-be.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}

(function(){try{const h=document.head;if(!h.querySelector('link[rel=apple-touch-icon]')){const a=document.createElement('link');a.rel='apple-touch-icon';a.href=ICON;h.appendChild(a);const b=document.createElement('link');b.rel='icon';b.type='image/png';b.href=ICON;h.appendChild(b);const m=document.createElement('meta');m.name='apple-mobile-web-app-title';m.content='Gia Đình Dưa Hấu';h.appendChild(m)}}catch(e){}})();
document.addEventListener('toggle',e=>{const id=e.target&&e.target.dataset&&e.target.dataset.id;if(id){e.target.open?openSet.add(id):openSet.delete(id)}},true);
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(t.tagName==='BUTTON')e.preventDefault();
  if(a==='go')go(t.dataset.v);
  else if(a==='done'){S.done[id]=!S.done[id];save();renderTop();renderHome();renderPaper();renderVax()}
  else if(a==='bag'){S.bag[id]=!S.bag[id];save();renderGuide();renderHome()}
  else if(a==='dv'){S.dv=!S.dv;save();renderVax()}
  else if(a==='geo')geo();
  else if(a==='manual'){S.man={t:$('#manT').value,rh:$('#manRh').value};S.useMan=S.man.t!=='';save();renderWx()}
  else if(a==='manoff'){S.useMan=false;save();renderWx()}
  else if(a==='setdob'){const v=$('#dobHome').value;if(v){S.dob=v;save();render()}}
  else if(a==='setedd'){const v=$('#eddHome').value;if(v){S.edd=v;save();render()}}
  else if(a==='ics')dlICS();
  else if(a==='reset'){confirmReset=true;renderBaby()}
  else if(a==='resetno'){confirmReset=false;renderBaby()}
  else if(a==='resetok'){S=Object.assign({},DEF,{done:{},bag:{},man:{t:'',rh:''}});confirmReset=false;save();render();loadWx()}});
document.addEventListener('change',e=>{const t=e.target,v=t.value;
  if(t.id==='citySel'){S.city=v;S.geo=false;S.useMan=false;save();loadWx()}
  else if(t.id==='nameIn'){S.name=v.trim();save();renderTop()}
  else if(t.id==='dobIn'&&t.closest('#v-be')){S.dob=v;save();render()}
  else if(t.id==='eddIn'&&t.closest('#v-be')){S.edd=v;save();render()}
  else if(t.id==='regIn'){S.reg=v;save();renderPaper()}});
window.addEventListener('hashchange',()=>go((location.hash||'#home').slice(1)));
render();go((location.hash||'#home').slice(1));loadWx();
</script>
